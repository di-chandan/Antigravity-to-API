<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">Antigravity plus API</title>
  <desc id="desc">Antigravity wordmark and gradient emblem, a glowing plus sign, and a cloud API symbol on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b20"/><stop offset=".52" stop-color="#080f2d"/><stop offset="1" stop-color="#030817"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx=".25" cy=".34" r=".56"><stop offset="0" stop-color="#7d32b9" stop-opacity=".26"/><stop offset="1" stop-color="#7d32b9" stop-opacity="0"/></radialGradient>
    <radialGradient id="coolGlow" cx=".78" cy=".40" r=".57"><stop offset="0" stop-color="#064ce8" stop-opacity=".3"/><stop offset="1" stop-color="#064ce8" stop-opacity="0"/></radialGradient>
    <linearGradient id="aGradient" x1="0" y1="0" x2=".78" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset=".28" stop-color="#ff4cac"/><stop offset=".57" stop-color="#9b57ff"/><stop offset=".82" stop-color="#378cff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18f1ff"/><stop offset=".53" stop-color="#2584ff"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
    <linearGradient id="plusGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#75dcff"/><stop offset="1" stop-color="#3988ff"/></linearGradient>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowWarm" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="600" rx="30" fill="url(#background)"/>
  <rect width="1800" height="600" rx="30" fill="url(#warmGlow)"/>
  <rect width="1800" height="600" rx="30" fill="url(#coolGlow)"/>
  <path d="M65 95 H1735 M65 505 H1735" stroke="#5275bb" stroke-opacity=".12" stroke-width="1"/>
  <!-- Stylized Antigravity A emblem -->
  <g transform="translate(235 85)" filter="url(#glowWarm)">
    <path d="M20 255 L111 55 Q131 13 157 13 Q184 13 203 55 L294 255 Q303 276 284 284 Q264 292 249 274 L169 111 Q163 98 157 98 Q151 98 145 111 L65 274 Q50 292 30 284 Q11 276 20 255 Z" fill="url(#aGradient)"/>
    <path d="M104 171 Q130 120 157 120 Q184 120 210 171 L187 187 Q174 168 157 168 Q140 168 127 187 Z" fill="#11153a" fill-opacity=".7"/>
  </g>
  <text x="385" y="442" fill="#f5f7ff" font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="82" font-weight="650" letter-spacing="-3" text-anchor="middle">Antigravity</text>
  <!-- Plus sign -->
  <g filter="url(#glowBlue)" stroke="url(#plusGradient)" stroke-width="13" stroke-linecap="round">
    <path d="M900 235 V365"/><path d="M835 300 H965"/>
  </g>
  <circle cx="900" cy="300" r="87" fill="none" stroke="#48a8ff" stroke-opacity=".13" stroke-width="2"/>
  <!-- API cloud and connectors -->
  <g filter="url(#glowBlue)" fill="none" stroke="url(#blueGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1305 378 H1217 C1172 378 1135 341 1135 296 C1135 254 1165 218 1206 212 C1218 144 1277 95 1347 95 C1410 95 1465 134 1483 193 C1530 190 1568 228 1568 274 C1568 320 1531 357 1486 357 H1460"/>
    <path d="M1340 380 V422 L1305 457"/><path d="M1435 380 V465"/><path d="M1485 380 V422 L1520 457"/>
    <circle cx="1291" cy="470" r="17" fill="#09112d"/><circle cx="1435" cy="489" r="17" fill="#09112d"/><circle cx="1534" cy="470" r="17" fill="#09112d"/>
  </g>
  <text x="1352" y="302" fill="#f9fbff" font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="112" font-weight="750" letter-spacing="2" text-anchor="middle">API</text>
  <text x="900" y="555" fill="#91a9dc" font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="5" text-anchor="middle">LOCAL AI  ·  OPENAI-COMPATIBLE  ·  BUILT FOR YOUR TOOLS</text>
</svg>
